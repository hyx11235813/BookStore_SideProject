# 機敏資訊（資料庫密碼、JWT 金鑰、郵件密碼）一律透過環境變數或 application-local.properties 提供，不要寫進版本控制。
# 本機開發：複製 application-local.properties.example 為 application-local.properties 後以 local profile 啟動。

server.port=${SERVER_PORT:8081}
# 所有 API 都掛在 /api 底下，前端開發時由 vue.config.js 代理轉發
spring.mvc.servlet.path=/api

# Database
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:bookStore};trustServerCertificate=true;
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application
# 前端網址：信件中的連結與驗證後的轉址都以此為基底
app.url=${APP_URL:http://localhost:8080}
# JWT 簽章金鑰（至少 32 字元），固定金鑰才能讓伺服器重啟後既有 token 仍有效
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:2}
# 使用者上傳檔案（頭像等）的存放目錄
app.file.upload-dir=${UPLOAD_DIR:files}
