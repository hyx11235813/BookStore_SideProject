server.servlet.context-path=/
server.error.path=/error
server.port=${app.port}
spring.mvc.view.prefix=/static/
spring.mvc.view.suffix=.html
spring.mvc.servlet.path=/api
### can use put and delete request
spring.mvc.hiddenmethod.filter.enabled=true
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/**
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://${app.host}:1433;databaseName=bookStore;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sa111
############################################
#JPA
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2016Dialect
## show sql
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
